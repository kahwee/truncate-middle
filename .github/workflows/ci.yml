name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Test release metadata guard
        run: node --test scripts/check-release-guard.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Independent checks must all pass before building the shared runtime artifact.
      - parallel:
          - run: pnpm audit --audit-level=high
          - run: pnpm run lint
          - run: pnpm run typecheck
          - run: pnpm run coverage
      - run: pnpm run build
      - run: node scripts/test-runtime.mjs
      - name: Pack checked package
        run: pnpm pack --out "$RUNNER_TEMP/truncate-middle-check.tgz"

      - name: Read-only publish dry run of the checked tarball
        working-directory: ${{ runner.temp }}
        run: npm publish "$RUNNER_TEMP/truncate-middle-check.tgz" --dry-run --ignore-scripts --access public --tag latest

      - name: Upload built package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-package
          path: dist/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  runtime:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-package
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify ESM and CommonJS package exports
        run: node scripts/test-runtime.mjs
