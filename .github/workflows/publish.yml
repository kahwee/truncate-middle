# npm trusted publishing; approved for kahwee/truncate-middle only.
name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to publish (must be reviewed on main)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release-truncate-middle
  queue: max
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.metadata.outputs.package_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Require successful CI on this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --test scripts/check-release-guard.mjs
          node scripts/release-check.mjs "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      # All independent source checks must pass before producing the release artifact.
      - parallel:
          - run: pnpm run lint
          - run: pnpm run typecheck
          - run: pnpm run coverage
      - name: Build and check runtime exports
        run: pnpm run build && node scripts/test-runtime.mjs
      - name: Pack the checked output
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --out "$RUNNER_TEMP/release/package.tgz"
          node scripts/release-check.mjs "$RELEASE_TAG"
          tar -tzf "$RUNNER_TEMP"/release/*.tgz
          tar -xOf "$RUNNER_TEMP"/release/*.tgz package/package.json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const source = JSON.parse(readFileSync("package.json")); const packed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/packed-package.json")); if (packed.name !== source.name || packed.version !== source.version || packed.private) throw new Error("Packed package identity differs from checked source")'
      - name: Check registry and archive identity
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-check.mjs "$RELEASE_TAG" --registry "$RUNNER_TEMP/release/package.tgz"
      - name: Upload the checked archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-archive
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, package installation, build scripts or repository code here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-archive
          path: ${{ runner.temp }}/release
      - name: Validate archive identity and publish without lifecycle scripts
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          tar -xOf release/package.tgz package/package.json > packed-package.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const version = process.env.EXPECTED_VERSION;
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const pkg = JSON.parse(readFileSync('packed-package.json', 'utf8'));
          if (!stable.test(version) || process.env.RELEASE_TAG !== `v${version}` ||
              pkg.name !== 'truncate-middle' || pkg.version !== version || pkg.private || pkg.publishConfig) {
            throw new Error('Archive identity does not match reviewed release');
          }
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync('release/package.tgz')).digest('base64');
          const readRegistry = async () => {
            const response = await fetch('https://registry.npmjs.org/truncate-middle', { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
            const data = await response.json();
            const latest = data['dist-tags']?.latest;
            if (data.name !== pkg.name || !stable.test(latest) || !data.versions?.[latest]) {
              throw new Error('Inconsistent registry metadata');
            }
            return data;
          };
          const compare = (a, b) => {
            const x = a.split('.').map(BigInt), y = b.split('.').map(BigInt);
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
            return 0;
          };
          const verify = (entry) => {
            if (entry.name !== pkg.name || entry.version !== version || entry.dist?.integrity !== integrity) {
              throw new Error('Published archive identity or integrity mismatch');
            }
          };
          const before = await readRegistry();
          if (Object.hasOwn(before.versions, version)) verify(before.versions[version]);
          else {
            if (compare(before['dist-tags'].latest, version) >= 0) throw new Error('Refusing latest downgrade');
            execFileSync('npm', ['publish', './release/package.tgz', '--ignore-scripts', '--access', 'public', '--tag', 'latest', '--registry', 'https://registry.npmjs.org'], { stdio: 'inherit' });
          }
          for (let attempt = 0; attempt < 6; attempt++) {
            const after = await readRegistry();
            if (Object.hasOwn(after.versions, version)) {
              verify(after.versions[version]);
              if (compare(after['dist-tags'].latest, version) >= 0) process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Registry verification exhausted');
          JS
